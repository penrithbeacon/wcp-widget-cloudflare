<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cloudflare Domains + DNS</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;
    --text:#e6edf3;--muted:#8b949e;--accent:#f0883e;
    --green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;--radius:8px;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;overflow:hidden;}
  /* Themed scrollbars — match Penrith Beacon WCP theme variables */
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:var(--surface2);}
  *::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  *::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  *{scrollbar-color:var(--border) var(--surface2);scrollbar-width:thin;}
  .wrap{display:flex;flex-direction:column;height:100%;}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .title{font-size:14px;font-weight:600;flex:1;}
  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:inherit;
    font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .15s;}
  .btn:hover{background:var(--border);border-color:var(--muted);}
  .btn-sm{font-size:11px;padding:3px 8px;}
  .body{flex:1;display:flex;overflow:hidden;}
  .pane{overflow-y:auto;padding:10px 14px;}
  .pane.left{width:320px;flex-shrink:0;border-right:1px solid var(--border);}
  .pane.right{flex:1;min-width:0;}
  /* Drag handle between panes */
  .splitter{width:5px;flex-shrink:0;background:var(--border);cursor:col-resize;transition:background .15s;
    position:relative;}
  .splitter:hover,.splitter.dragging{background:var(--accent);}
  .splitter::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:2px;height:32px;background:rgba(255,255,255,.25);border-radius:1px;}
  .empty{text-align:center;color:var(--muted);font-size:12px;padding:40px 16px;}
  .err{color:var(--red);font-size:12px;padding:14px;background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.2);border-radius:6px;}
  .dom{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:default;
    border:1px solid transparent;margin-bottom:4px;}
  .dom:hover{background:var(--surface2);}
  .dom.active{background:rgba(240,136,62,.1);border-color:var(--accent);}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.green{background:var(--green);}
  .dot.yellow{background:var(--yellow);}
  .dot.grey{background:var(--muted);}
  .dom-name{flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .registrar{font-size:10px;color:var(--muted);}
  .registrar.cf{color:var(--accent);}
  .pane.right .dns-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .pane.right .dns-head .zone{font-weight:600;font-size:13px;flex:1;font-family:'SF Mono',Monaco,monospace;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:7px 10px;color:var(--muted);font-weight:500;font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
  td{padding:7px 10px;border-bottom:1px solid var(--border);font-family:'SF Mono',Monaco,monospace;font-size:12px;}
  tr:hover td{background:var(--surface2);}
  .tag{display:inline-block;font-size:10px;background:var(--surface2);border:1px solid var(--border);
    border-radius:3px;padding:1px 6px;color:var(--blue);}
  .proxied{color:var(--accent);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">🌐 Domains + DNS</div>
    <button class="btn" onclick="reload()">Refresh</button>
  </div>
  <div class="body">
    <div class="pane left" id="left"><div class="empty">Loading…</div></div>
    <div class="splitter" id="splitter" title="Drag to resize"></div>
    <div class="pane right" id="right"><div class="empty">Select a domain to view its DNS records.</div></div>
  </div>
</div>

<script>
const WCP_INSTANCE_ID      = "{{ wcp_instance_id|default('', true) }}";
const WCP_ORCHESTRATION_ID = "{{ wcp_orchestration_id|default('', true) }}";
const WCP_APPLICATION_ID   = "{{ wcp_application_id|default('', true) }}";
function wcpFetch(url, opts){
  opts = opts || {};
  const extra = {};
  if (WCP_INSTANCE_ID)      extra['Wcp-Instance-Id']      = WCP_INSTANCE_ID;
  if (WCP_ORCHESTRATION_ID) extra['Wcp-Orchestration-Id'] = WCP_ORCHESTRATION_ID;
  if (WCP_APPLICATION_ID)   extra['Wcp-Application-Id']   = WCP_APPLICATION_ID;
  opts.headers = Object.assign({}, opts.headers || {}, extra);
  return fetch(url, opts);
}
let _zones = [];
let _selectedZoneId = null;

async function reload() {
  document.getElementById('left').innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await wcpFetch('/widget/api/zones');
    const d = await r.json();
    if (!d.success) {
      document.getElementById('left').innerHTML = `<div class="err">${escape(d.error)}</div>`;
      return;
    }
    _zones = d.data.zones || [];
    renderZones();
    // Re-fetch currently selected DNS if any
    if (_selectedZoneId) loadDns(_selectedZoneId, true);
  } catch (e) {
    document.getElementById('left').innerHTML = `<div class="err">${escape(e.message)}</div>`;
  }
}

function renderZones() {
  if (!_zones.length) {
    document.getElementById('left').innerHTML = '<div class="empty">No domains found.</div>';
    return;
  }
  document.getElementById('left').innerHTML = _zones.map(z => {
    const dotClass = z.status === 'active' ? 'green' : z.status === 'pending' ? 'yellow' : 'grey';
    const reg = z.registeredAtCloudflare
      ? '<span class="registrar cf">Cloudflare</span>'
      : `<span class="registrar">${escape(z.originalRegistrar || 'external')}</span>`;
    const isActive = z.id === _selectedZoneId;
    return `
      <div class="dom ${isActive?'active':''}" onclick="loadDns('${escape(z.id)}')">
        <span class="dot ${dotClass}" title="${escape(z.status||'')}"></span>
        <span class="dom-name" title="${escape(z.name)}">${escape(z.name)}</span>
        ${reg}
      </div>`;
  }).join('');
}

async function loadDns(zoneId, force) {
  // Toggle off if already selected
  if (_selectedZoneId === zoneId && !force) {
    _selectedZoneId = null;
    renderZones();
    document.getElementById('right').innerHTML = '<div class="empty">Select a domain to view its DNS records.</div>';
    return;
  }
  _selectedZoneId = zoneId;
  renderZones();
  const zone = _zones.find(z => z.id === zoneId);
  document.getElementById('right').innerHTML = '<div class="empty">Loading DNS records…</div>';
  try {
    const r = await wcpFetch(`/widget/api/dns/${encodeURIComponent(zoneId)}`);
    const d = await r.json();
    if (!d.success) {
      document.getElementById('right').innerHTML = `<div class="err">${escape(d.error)}</div>`;
      return;
    }
    renderDns(zone, d.data.records || []);
  } catch (e) {
    document.getElementById('right').innerHTML = `<div class="err">${escape(e.message)}</div>`;
  }
}

function renderDns(zone, records) {
  if (!records.length) {
    document.getElementById('right').innerHTML = `
      <div class="dns-head"><div class="zone">${escape(zone.name)}</div></div>
      <div class="empty">No DNS records for this zone.</div>`;
    return;
  }
  document.getElementById('right').innerHTML = `
    <div class="dns-head">
      <div class="zone">${escape(zone.name)}</div>
      <span style="font-size:11px;color:var(--muted);">${records.length} record${records.length===1?'':'s'}</span>
    </div>
    <table>
      <thead><tr><th>Type</th><th>Name</th><th>Content</th><th>TTL</th><th></th></tr></thead>
      <tbody>${records.map(r => `
        <tr>
          <td><span class="tag">${escape(r.type)}</span></td>
          <td>${escape(r.name)}</td>
          <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escape(r.content)}">${escape(r.content)}</td>
          <td>${escape(r.ttl)}</td>
          <td>${r.proxied ? '<span class="proxied" title="Proxied through Cloudflare">☁</span>' : ''}</td>
        </tr>`).join('')}</tbody>
    </table>`;
}

function escape(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── Splitter drag + persistence ────────────────────────────────────────────────
const SPLIT_KEY = 'wcp-cloudflare:domains-split-width';
const leftPane = document.getElementById('left');
const splitter = document.getElementById('splitter');
const savedWidth = parseInt(localStorage.getItem(SPLIT_KEY));
if (savedWidth && savedWidth >= 180 && savedWidth <= 700) {
  leftPane.style.width = savedWidth + 'px';
}
splitter.addEventListener('mousedown', e => {
  e.preventDefault();
  const startX = e.clientX;
  const startW = leftPane.offsetWidth;
  splitter.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  function move(ev) {
    const w = Math.max(180, Math.min(700, startW + ev.clientX - startX));
    leftPane.style.width = w + 'px';
  }
  function up() {
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    localStorage.setItem(SPLIT_KEY, leftPane.offsetWidth);
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});

reload();
</script>
</body>
</html>
