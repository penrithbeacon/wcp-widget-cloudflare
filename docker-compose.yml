services:
  cloudflare:
    build: .
    image: wcp-widget-cloudflare
    container_name: wcp-widget-cloudflare
    ports:
      - "3742:3742"
    volumes:
      - cf-data:/app/data
      - ./published:/app/published
    environment:
      - CONTAINER_NAME=wcp-widget-cloudflare
    restart: unless-stopped

volumes:
  cf-data:
